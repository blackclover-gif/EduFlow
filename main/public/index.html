<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>LMS Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

<div class="login-wrapper">

<h1 class="hero-title">
Learn Smarter
</h1>

<div class="login-box">

<h2>
Welcome Back
</h2>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button onclick="login()">
Login
</button>

<!-- NEW: links added below button -->

<div style="display:flex;justify-content:space-between;margin-top:14px">

<a href="register.html"
style="font-size:13px;color:rgba(255,255,255,0.55);text-decoration:none">
New here?
<span style="color:#4ecdc4;font-weight:600">
Register
</span>
</a>

<a href="forgot-password.html"
style="font-size:13px;color:#4ecdc4;font-weight:600;text-decoration:none">
Forgot password?
</a>

</div>

</div>

</div>

</div>

<script>

async function login(){

try{

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

const response =
await fetch('http://localhost:5000/api/login',{

method:'POST',

headers:{
'Content-Type':'application/json',
},

body:JSON.stringify({
email,
password,
}),

});

const data =
await response.json();

console.log(data);

if(data.success){

localStorage.setItem(
'token',
data.token
);

localStorage.setItem(
'role',
data.user.role
);

localStorage.setItem(
'name',
data.user.name
);

if(data.user.role === 'professor'){

window.location.href =
'professor.html';

}else{

window.location.href =
'student.html';

}

}else{

if(data.needsVerification){

alert('⚠️ Please verify your email first.');

window.location.href =
'verify.html?email=' +
encodeURIComponent(email);

return;

}

alert(data.message);

}

}catch(err){

console.error(err);

alert('Login failed');

}

}

</script>

</body>
</html>
