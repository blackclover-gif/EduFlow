<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --accent: #7c3aed;
    --accent2: #a78bfa;
    --text: #f1f5f9;
    --text-muted: rgba(241,245,249,0.45);
    --text-dim: rgba(241,245,249,0.25);
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,58,237,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(52,211,153,0.07) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }
  .page { position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:40px 24px 80px; }

  /* Header */
  .page-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: none;
    font-size: 18px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: var(--surface-hover); color: var(--text); }
  .header-text h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f1f5f9 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-text p {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
  }

  /* Stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: rgba(255,255,255,0.13); }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    line-height: 1;
  }
  .stat-value.purple { color: var(--accent2); }
  .stat-value.green  { color: var(--success); }
  .stat-value.red    { color: var(--danger); }
  .stat-value.yellow { color: var(--warning); }
  .stat-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }

  /* Charts row */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .chart-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .chart-wrap { position: relative; height: 220px; }

  /* Student table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--border);
  }
  .table-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 12px 24px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 14px 24px;
    font-size: 14px;
    color: var(--text-muted);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-hover); }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }
  .rank-1 { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
  .rank-2 { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
  .rank-3 { background: rgba(180,83,9,0.15); color: #d97706; border: 1px solid rgba(180,83,9,0.3); }
  .rank-n { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); }

  .score-pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }
  .score-high   { background: rgba(52,211,153,0.12); color: var(--success); border: 1px solid rgba(52,211,153,0.25); }
  .score-mid    { background: rgba(251,191,36,0.12);  color: var(--warning); border: 1px solid rgba(251,191,36,0.25); }
  .score-low    { background: rgba(248,113,113,0.12); color: var(--danger);  border: 1px solid rgba(248,113,113,0.25); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mini-bar-bg {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.07);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(139,92,246,0.2);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width:700px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .charts-row { grid-template-columns: 1fr; }
  }
  @media(max-width:400px) {
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="page-header">
    <a href="professor.html" class="back-btn">←</a>
    <div class="header-text">
      <h1>Quiz Analytics</h1>
      <p id="lectureIdDisplay">loading...</p>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Loading analytics...
    </div>
  </div>

</div>

<script>
const params    = new URLSearchParams(window.location.search);
const lectureId = params.get('lectureId') || '';

document.getElementById('lectureIdDisplay').textContent =
  'lecture / ' + (lectureId ? lectureId.slice(-8) + '...' : 'unknown');

let barChart, donutChart;

async function loadAnalytics() {
  const response = await fetch(`/api/analytics/${lectureId}`, {
    headers: { Authorization: localStorage.getItem('token') }
  });

  const data = await response.json();

  if (!data.success) {
    document.getElementById('content').innerHTML =
      `<div class="empty">Failed to load analytics.<br>${data.message}</div>`;
    return;
  }

  if (data.totalAttempts === 0) {
    document.getElementById('content').innerHTML =
      `<div class="empty">No submissions yet for this quiz.<br>Share the lecture with students to get started.</div>`;
    return;
  }

  renderPage(data);
}

function scoreClass(pct) {
  if (pct >= 70) return 'score-high';
  if (pct >= 40) return 'score-mid';
  return 'score-low';
}

function barColor(pct) {
  if (pct >= 70) return '#34d399';
  if (pct >= 40) return '#fbbf24';
  return '#f87171';
}

function rankBadge(i) {
  const cls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
  return `<span class="rank-badge ${cls}">${i + 1}</span>`;
}

function renderPage(data) {
  document.getElementById('content').innerHTML = `

    <!-- Stat Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Attempts</div>
        <div class="stat-value purple">${data.totalAttempts}</div>
        <div class="stat-sub">students submitted</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Average Score</div>
        <div class="stat-value yellow">${data.averageScore}%</div>
        <div class="stat-sub">class average</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pass Rate</div>
        <div class="stat-value green">${data.passRate}%</div>
        <div class="stat-sub">scored ≥ 50%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Score Range</div>
        <div class="stat-value" style="font-size:22px;color:var(--text)">
          <span style="color:var(--success)">${data.highestScore}%</span>
          <span style="color:var(--text-dim);font-size:16px;"> / </span>
          <span style="color:var(--danger)">${data.lowestScore}%</span>
        </div>
        <div class="stat-sub">highest / lowest</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Score Distribution</div>
        <div class="chart-wrap">
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Pass vs Fail</div>
        <div class="chart-wrap">
          <canvas id="donutChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Student Table -->
    <div class="table-card">
      <div class="table-header">
        <div class="table-title">Student Results — ranked by score</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Student</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Progress</th>
          </tr>
        </thead>
        <tbody>
          ${data.students.map((s, i) => `
            <tr>
              <td>${rankBadge(i)}</td>
              <td style="color:var(--text);font-weight:500;">${s.name}</td>
              <td style="font-family:'DM Mono',monospace;">${s.score} / ${s.total}</td>
              <td><span class="score-pill ${scoreClass(s.percentage)}">${s.percentage}%</span></td>
              <td style="min-width:140px;">
                <div class="progress-row">
                  <div class="mini-bar-bg">
                    <div class="mini-bar-fill"
                      style="width:${s.percentage}%;background:${barColor(s.percentage)};">
                    </div>
                  </div>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  // Bar chart — distribution
  const barCtx = document.getElementById('barChart').getContext('2d');
  new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: data.distribution.map(d => d.label),
      datasets: [{
        label: 'Students',
        data: data.distribution.map(d => d.count),
        backgroundColor: [
          'rgba(248,113,113,0.7)',
          'rgba(251,191,36,0.7)',
          'rgba(251,191,36,0.7)',
          'rgba(52,211,153,0.7)',
          'rgba(52,211,153,0.7)',
        ],
        borderColor: [
          '#f87171','#fbbf24','#fbbf24','#34d399','#34d399'
        ],
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: 'rgba(241,245,249,0.45)', font: { family: 'Space Grotesk', size: 11 } }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: 'rgba(241,245,249,0.45)',
            font: { family: 'DM Mono', size: 11 },
            stepSize: 1
          },
          beginAtZero: true
        }
      }
    }
  });

  // Donut chart — pass vs fail
  const passed = data.students.filter(s => s.percentage >= 50).length;
  const failed = data.totalAttempts - passed;
  const donutCtx = document.getElementById('donutChart').getContext('2d');
  new Chart(donutCtx, {
    type: 'doughnut',
    data: {
      labels: ['Passed', 'Failed'],
      datasets: [{
        data: [passed, failed],
        backgroundColor: ['rgba(52,211,153,0.75)', 'rgba(248,113,113,0.75)'],
        borderColor: ['#34d399', '#f87171'],
        borderWidth: 1,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '68%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: 'rgba(241,245,249,0.55)',
            font: { family: 'Space Grotesk', size: 12 },
            padding: 16,
            usePointStyle: true,
            pointStyleWidth: 8
          }
        }
      }
    }
  });
}

loadAnalytics();
</script>
</body>
</html>
