<!DOCTYPE html>
<html>
<head>
  <title>Verify Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Verify Account</h1>

  <p class="subtitle">
    Enter the 6-digit OTP sent to your email address.
  </p>

  <input
    type="email"
    id="email"
    placeholder="Your email address"
  >

  <input
    type="text"
    id="otp"
    placeholder="Enter 6-digit OTP"
    maxlength="6"
    style="letter-spacing:8px;font-size:20px;text-align:center"
  >

  <button onclick="verifyOTP()">
    Verify Account
  </button>

  <button onclick="resendOTP()" style="margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);box-shadow:none;font-size:13px">
    Resend OTP
  </button>

  <p style="text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,0.4)">
    Already verified?
    <a href="index.html" style="color:#4ecdc4;font-weight:600">Log in</a>
  </p>

</div>

<script>

// Pre-fill email if redirected from register page
const params = new URLSearchParams(window.location.search);
if (params.get('email')) {
  document.getElementById('email').value = params.get('email');
}

async function verifyOTP() {

  const email = document.getElementById('email').value.trim();
  const otp   = document.getElementById('otp').value.trim();

  if (!email || !otp) {
    return alert('Please enter your email and OTP.');
  }

  const response = await fetch('/api/verify-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, otp }),
  });

  const data = await response.json();

  if (data.success) {
    alert('✅ ' + data.message);
    window.location.href = 'index.html';
  } else {
    alert('❌ ' + data.message);
  }
}

async function resendOTP() {

  const email = document.getElementById('email').value.trim();

  if (!email) {
    return alert('Please enter your email first.');
  }

  const response = await fetch('/api/resend-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });

  const data = await response.json();
  alert(data.success ? '📧 ' + data.message : '❌ ' + data.message);
}

</script>

</body>
</html>
